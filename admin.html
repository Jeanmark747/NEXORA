<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA | Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #07111f;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .header {
      padding: 22px;
      border: 1px solid #1e3a5f;
      border-radius: 18px;
      background: linear-gradient(135deg, #102c4d, #0b1728);
      margin-bottom: 20px;
    }

    .logo {
      color: #43e5bd;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #a8b8cc;
      margin-top: 8px;
    }

    .card {
      background: #101d30;
      border: 1px solid #263851;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 19px;
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #344861;
      border-radius: 9px;
      background: #081423;
      color: white;
      margin: 8px 0 12px;
      font-size: 14px;
    }

    button {
      padding: 11px 15px;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
      margin: 4px 3px 4px 0;
    }

    .primary {
      background: #43e5bd;
      color: #06251e;
    }

    .secondary {
      background: #243750;
      color: white;
    }

    .approve {
      background: #0d9b70;
      color: white;
    }

    .reject {
      background: #d9485f;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      background: #101d30;
      border: 1px solid #263851;
      padding: 16px 10px;
      border-radius: 12px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      margin-top: 8px;
      color: #43e5bd;
    }

    .stat span {
      color: #a8b8cc;
      font-size: 12px;
    }

    .deposit {
      border: 1px solid #2b405a;
      background: #0b1728;
      padding: 16px;
      border-radius: 12px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .deposit p {
      color: #d0dbea;
      font-size: 14px;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .pending {
      background: #5b4514;
      color: #ffd76a;
    }

    .approved {
      background: #104a38;
      color: #67f0bd;
    }

    .rejected {
      background: #571e2a;
      color: #ff9aaa;
    }

    .message {
      display: none;
      padding: 12px;
      margin: 12px 0;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }

    .error {
      display: block;
      background: #4b1e29;
      color: #ffc1ca;
    }

    .success {
      display: block;
      background: #104332;
      color: #9bffd8;
    }

    .muted {
      color: #93a5bb;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="logo">NEXORA</div>
      <div class="subtitle">Administrator Dashboard</div>
      <p class="muted">Manage and review deposit requests.</p>
    </header>

    <section class="card">
      <h2>🔐 Admin Connection</h2>

      <label for="apiUrl">Auth Worker URL</label>
      <input
        id="apiUrl"
        type="url"
        value="https://nexora-auth.pawaijeanmark17.workers.dev"
        autocomplete="url"
      >

      <label for="token">Access Token</label>
      <input
        id="token"
        type="password"
        placeholder="Paste your existing login access token"
        autocomplete="off"
      >

      <button class="primary" id="connectBtn" onclick="loadDeposits()">
        Connect & Load Deposits
      </button>

      <button class="secondary" onclick="clearToken()">
        Clear Token
      </button>

      <p class="muted">
        Use your existing authenticated admin account's access token.
        Do not share your token with anyone.
      </p>

      <div id="message" class="message"></div>
    </section>

    <section id="dashboard" class="hidden">

      <div class="stats">
        <div class="stat">
          <span>TOTAL REQUESTS</span>
          <strong id="totalCount">0</strong>
        </div>

        <div class="stat">
          <span>PENDING</span>
          <strong id="pendingCount">0</strong>
        </div>

        <div class="stat">
          <span>APPROVED</span>
          <strong id="approvedCount">0</strong>
        </div>
      </div>

      <section class="card">
        <h2>📋 Deposit Requests</h2>

        <select id="statusFilter" onchange="renderDeposits()">
          <option value="all">All Requests</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>

        <button class="secondary" onclick="loadDeposits()">
          🔄 Refresh
        </button>

        <div id="depositList">
          <p class="muted">Connect to load deposit requests.</p>
        </div>
      </section>
    </section>

  </main>

  <script>
    "use strict";

    let deposits = [];
    let busy = false;

    const $ = id => document.getElementById(id);

    function showMessage(text, type = "error") {
      const box = $("message");
      box.textContent = text;
      box.className = "message " + type;
    }

    function clearMessage() {
      $("message").textContent = "";
      $("message").className = "message";
    }

    function getConfig() {
      const base = $("apiUrl").value.trim().replace(/\/+$/, "");
      const token = $("token").value.trim();

      if (!base.startsWith("https://")) {
        throw new Error("Please enter a valid HTTPS Auth Worker URL.");
      }

      if (!token) {
        throw new Error("Paste your admin account access token first.");
      }

      return { base, token };
    }

    async function apiRequest(path, options = {}) {
      const { base, token } = getConfig();

      const response = await fetch(base + path, {
        ...options,
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      const raw = await response.text();
      let data = {};

      try {
        data = raw ? JSON.parse(raw) : {};
      } catch {
        data = { message: raw };
      }

      if (!response.ok) {
        throw new Error(
          data.error ||
          data.message ||
          ("Request failed with HTTP " + response.status)
        );
      }

      return data;
    }

    async function loadDeposits() {
      if (busy) return;

      busy = true;
      $("connectBtn").disabled = true;
      $("connectBtn").textContent = "Loading...";
      clearMessage();

      try {
        const data = await apiRequest("/admin/deposits");

        deposits = Array.isArray(data)
          ? data
          : Array.isArray(data.deposits)
            ? data.deposits
            : Array.isArray(data.requests)
              ? data.requests
              : [];

        $("dashboard").classList.remove("hidden");
        renderDeposits();
        showMessage("Deposit requests loaded successfully.", "success");

      } catch (error) {
        showMessage(
          "Unable to load deposits: " + error.message +
          ". Check the token, admin permissions, and Worker API."
        );
      } finally {
        busy = false;
        $("connectBtn").disabled = false;
        $("connectBtn").textContent = "Connect & Load Deposits";
      }
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function formatMoney(amount) {
      const number = Number(amount);
      if (!Number.isFinite(number)) return escapeHTML(amount);
      return number.toLocaleString("en-PH", {
        style: "currency",
        currency: "PHP"
      });
    }

    function formatDate(value) {
      if (!value) return "Not available";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return escapeHTML(value);

      return date.toLocaleString();
    }

    function renderDeposits() {
      const filter = $("statusFilter").value;

      $("totalCount").textContent = deposits.length;
      $("pendingCount").textContent =
        deposits.filter(item => item.status === "pending").length;
      $("approvedCount").textContent =
        deposits.filter(item => item.status === "approved").length;

      const filtered = deposits.filter(item =>
        filter === "all" || item.status === filter
      );

      if (!filtered.length) {
        $("depositList").innerHTML =
          '<p class="muted">No deposit requests found for this filter.</p>';
        return;
      }

      $("depositList").innerHTML = filtered.map(item => {
        const status = ["pending", "approved", "rejected"].includes(item.status)
          ? item.status
          : "pending";

        const id = escapeHTML(item.id || "");
        const userId = escapeHTML(item.user_id || "Not available");
        const sender = escapeHTML(item.sender_name || "Not available");
        const amount = formatMoney(item.amount);
        const date = formatDate(item.created_at);
        const reason = escapeHTML(item.rejection_reason || "");
        const canReview = status === "pending" && id;

        return `
          <article class="deposit">
            <p><strong>Request ID:</strong><br>${id || "Not available"}</p>
            <p><strong>User ID:</strong><br>${userId}</p>
            <p><strong>Sender Name:</strong> ${sender}</p>
            <p><strong>Amount:</strong> ${amount}</p>
            <p><strong>Submitted:</strong> ${date}</p>
            <p><strong>Status:</strong>
              <span class="status ${status}">${status}</span>
            </p>
            ${reason ? `<p><strong>Rejection reason:</strong> ${reason}</p>` : ""}
            ${
              canReview
                ? `
                  <button class="approve"
                    onclick="reviewDeposit('${id}', 'approved')">
                    ✓ Approve
                  </button>
                  <button class="reject"
                    onclick="reviewDeposit('${id}', 'rejected')">
                    ✕ Reject
                  </button>
                `
                : ""
            }
          </article>
        `;
      }).join("");
    }

    async function reviewDeposit(id, decision) {
      const item = deposits.find(row => String(row.id) === String(id));

      if (!item || item.status !== "pending") {
        showMessage("This request is no longer pending. Refresh the list.");
        return;
      }

      let rejectionReason = null;

      if (decision === "rejected") {
        rejectionReason = prompt("Enter the reason for rejecting this deposit:");

        if (rejectionReason === null) return;

        rejectionReason = rejectionReason.trim();

        if (!rejectionReason) {
          showMessage("Please enter a rejection reason.");
          return;
        }
      }

      const action = decision === "approved" ? "approve" : "reject";

      if (!confirm("Are you sure you want to " + action + " this deposit?")) {
        return;
      }

      try {
        clearMessage();

        await apiRequest("/admin/deposit/review", {
          method: "POST",
          body: JSON.stringify({
            deposit_id: id,
            id: id,
            decision: decision,
            rejection_reason: rejectionReason,
            p_rejection_reason: rejectionReason
          })
        });

        showMessage("Deposit review submitted. Refreshing requests...", "success");
        await loadDeposits();

      } catch (error) {
        showMessage(
          "Review failed: " + error.message +
          ". No successful approval should be assumed until the server confirms it."
        );
      }
    }

    function clearToken() {
      $("token").value = "";
      deposits = [];
      $("dashboard").classList.add("hidden");
      $("depositList").innerHTML = "";
      clearMessage();
      showMessage("Access token cleared.", "success");
    }
  </script>
</body>
  </html>
